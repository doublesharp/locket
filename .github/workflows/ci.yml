name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "1"
  CARGO_JOBS: "2"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      - name: Fetch locked dependencies for offline quality checks
        run: cargo fetch --locked

      - name: Check supply-chain exception ledger
        run: make supply-chain-exceptions

      - name: Generate third-party notices
        run: make third-party-notices

      - name: Validate distribution package definitions
        run: make distribution-check

      - name: Probe OS-host validation harnesses
        run: |
          scripts/validate-local-user-auth-real-host.sh --dry-run
          scripts/validate-packaged-os-canaries.sh --dry-run

      - name: Cargo check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-reports
          path: |
            target/quality/**
            supply-chain-exceptions.json
          if-no-files-found: ignore

  desktop-ui:
    name: desktop UI checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'

      - name: Check and test desktop UI
        run: make app-ui-check

      - name: Build desktop UI
        run: pnpm --dir crates/locket-app/ui build

  windows-transport:
    name: windows transport check
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-transport-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-windows-transport-${{ runner.os }}-

      - name: Check agent and CLI Windows transport crates
        run: cargo check -p locket-agent -p locket-cli --all-targets --locked
