name: package validation

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'scripts/**'
      - 'crates/**'
      - 'extensions/vscode/**'
      - 'dist/installers/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/package-validation.yml'

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-host:
    name: unsigned package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable paths
        run: |
          task_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then task_temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          mkdir -p "$task_temp/locket/tmp" "$task_temp/locket/cargo" "$task_temp/locket/build"
          {
            echo "TMPDIR=$task_temp/locket/tmp"
            echo "CARGO_TARGET_DIR=$task_temp/locket/cargo"
            echo "LOCKET_BUILD_ROOT=$task_temp/locket/build"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure package inspection commands
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$LOCKET_BUILD_ROOT/tools/bin"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$LOCKET_BUILD_ROOT/tools/bin/python3"
            chmod +x "$LOCKET_BUILD_ROOT/tools/bin/python3"
            echo "$LOCKET_BUILD_ROOT/tools/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
              macOS) brew install ripgrep ;;
              Windows)
                rg_root="$LOCKET_BUILD_ROOT/tools/ripgrep"
                mkdir -p "$rg_root"
                curl --fail --location --retry 3 --output "$rg_root/rg.zip" https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip
                python3 -c 'import hashlib,pathlib,sys,zipfile; archive=pathlib.Path(sys.argv[1]); assert hashlib.sha256(archive.read_bytes()).hexdigest()=="d0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1", "ripgrep checksum mismatch"; zipfile.ZipFile(archive).extractall(sys.argv[2])' "$rg_root/rg.zip" "$rg_root"
                echo "$rg_root/ripgrep-14.1.1-x86_64-pc-windows-msvc" >> "$GITHUB_PATH"
                ;;

            esac
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: '11.21.0'
      - name: Restore unsigned build cache
        id: unsigned-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/locket/cargo
            ${{ runner.temp }}/locket/build/tools
          key: unsigned-${{ matrix.os }}-tauri-2.10.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Check versions and packaging logic
        run: |
          node scripts/distribution.mjs versions
          node --test scripts/distribution.test.mjs
          python3 scripts/package_contents_test.py
          python3 scripts/installed_native_test.py
      - name: Install build tools and dependencies
        run: |
          rustup show
          if [[ ! -x "$LOCKET_BUILD_ROOT/tools/bin/cargo-tauri" ]] || [[ "$("$LOCKET_BUILD_ROOT/tools/bin/cargo-tauri" --version)" != 'tauri-cli 2.10.1' ]]; then
            cargo install tauri-cli --version 2.10.1 --locked --force --root "$LOCKET_BUILD_ROOT/tools"
          fi
          echo "$LOCKET_BUILD_ROOT/tools/bin" >> "$GITHUB_PATH"
          pnpm --dir crates/locket-app/ui install --frozen-lockfile
          pnpm --dir extensions/vscode install --frozen-lockfile
      - name: Build and inspect unsigned packages
        run: |
          scripts/package-native-installers.sh --target host --unsigned
          scripts/package-vscode-extension.sh
          scripts/validate-packaged-os-canaries.sh --artifact-root "$LOCKET_BUILD_ROOT/package"
      - name: Preserve unsigned build cache
        if: always() && !cancelled() && steps.unsigned-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/locket/cargo
            ${{ runner.temp }}/locket/build/tools
          key: unsigned-${{ matrix.os }}-tauri-2.10.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: locket-unsigned-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/locket/build/package/installers/macos/*unsigned.pkg
            ${{ runner.temp }}/locket/build/package/installers/windows/*.msi
            ${{ runner.temp }}/locket/build/package/installers/linux/*.deb
            ${{ runner.temp }}/locket/build/package/vscode/*.vsix
            ${{ runner.temp }}/locket/build/package/vscode/*.sha256
          if-no-files-found: ignore

  installed-host:
    name: installed package on fresh ${{ matrix.os }}
    needs: unsigned-host
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated acceptance paths
        run: |
          task_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then task_temp="$(cygpath -m "$RUNNER_TEMP")"; fi
          mkdir -p "$task_temp/locket/tmp" "$task_temp/locket/artifact"
          {
            echo "TMPDIR=$task_temp/locket/tmp"
            echo "LOCKET_ACCEPTANCE_ARTIFACT=$task_temp/locket/artifact"
          } >> "$GITHUB_ENV"
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$task_temp/locket/tools"
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$task_temp/locket/tools/python3"
            chmod +x "$task_temp/locket/tools/python3"
            echo "$task_temp/locket/tools" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: locket-unsigned-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/locket/artifact
      - name: Refresh Linux runtime package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Verify downloaded editor package
        run: |
          vsix="$(python3 -c 'import pathlib,sys; files=list(pathlib.Path(sys.argv[1]).glob("*.vsix")); len(files)==1 or sys.exit(f"expected one downloaded VSIX, found {len(files)}"); print(files[0])' "$LOCKET_ACCEPTANCE_ARTIFACT/vscode")"
          python3 scripts/check-package-contents.py --vsix "$vsix" --version "$(node scripts/distribution.mjs versions)"
      - name: Install and verify downloaded native package
        run: |
          python3 scripts/validate-installed-native.py --target host --installer-root "$LOCKET_ACCEPTANCE_ARTIFACT/installers" --scratch-root "$TMPDIR" --version "$(node scripts/distribution.mjs versions)"
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: locket-install-logs-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/locket/tmp/*install*.log
          if-no-files-found: ignore
