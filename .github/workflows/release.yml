name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_JOBS: "2"
  LOCKET_RELEASE_RUNNER_ATTESTED: ${{ vars.LOCKET_RELEASE_RUNNER_ID }}
  RUST_BACKTRACE: "1"

jobs:
  build:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    name: auditable release build
    runs-on: ${{ fromJSON(vars.LOCKET_RELEASE_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    environment: release
    steps:
      - name: Prepare temporary path
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Require release tag
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: exit 1

      - name: Require isolated runner attestation
        run: test -n "${LOCKET_RELEASE_RUNNER_ATTESTED}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release versions
        env:
          LOCKET_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/distribution.mjs versions

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Install release audit tools
        run: |
          cargo install cargo-auditable --locked
          cargo install cargo-audit --locked

      - name: Validate package manifests and signing inputs
        run: make distribution-check

      - name: Fetch locked dependencies for offline quality checks
        run: cargo fetch --locked

      - name: Generate release quality artifacts
        run: |
          make supply-chain-exceptions
          make third-party-notices
          STRICT=1 make audit
          make unsafe-inventory
          make sbom

      - name: Build auditable binaries
        run: make release-auditable

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-${{ github.ref_name }}
          path: |
            target/release/locket
            target/release/locket-desktop
            dist/installers/package-matrix.json
            dist/homebrew/locket.rb.in
          if-no-files-found: error

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/locket
            target/release/locket-desktop

      - name: Verify configured provenance policy
        env:
          SLSA_ARTIFACT: ${{ vars.LOCKET_SLSA_ARTIFACT }}
          SLSA_PROVENANCE: ${{ vars.LOCKET_SLSA_PROVENANCE }}
          SLSA_EXPECTED_REPOSITORY: ${{ vars.LOCKET_SLSA_EXPECTED_REPOSITORY }}
          SLSA_EXPECTED_BUILDER: ${{ vars.LOCKET_SLSA_EXPECTED_BUILDER }}
          SLSA_EXPECTED_BUILD_TYPE: ${{ vars.LOCKET_SLSA_EXPECTED_BUILD_TYPE }}
          SLSA_EXPECTED_WORKFLOW: ${{ vars.LOCKET_SLSA_EXPECTED_WORKFLOW }}
        run: |
          if [ -n "${SLSA_ARTIFACT}${SLSA_PROVENANCE}${SLSA_EXPECTED_REPOSITORY}${SLSA_EXPECTED_BUILDER}${SLSA_EXPECTED_BUILD_TYPE}${SLSA_EXPECTED_WORKFLOW}" ]; then
            make slsa-provenance STRICT=1
          else
            make slsa-provenance
          fi

      - name: Upload release quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locket-release-quality-${{ github.ref_name }}
          path: |
            target/quality/**
            supply-chain-exceptions.json
          if-no-files-found: error

  validate-packages:
    needs: build
    uses: ./.github/workflows/package-validation.yml
    permissions:
      contents: read
