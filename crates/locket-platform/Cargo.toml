[package]
name = "locket-platform"
description = "Platform integration layer for Locket"
edition.workspace = true
categories = ["os"]
keywords = ["secrets", "keychain", "platform"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# NOTE: this crate cannot use `lints.workspace = true` because the
# workspace `unsafe_code = "forbid"` lint cannot be overridden, and the
# platform backends require isolated `unsafe` blocks to call OS APIs.
# The lints below mirror the workspace lints (see the workspace
# `Cargo.toml`) but downgrade `unsafe_code` to `deny` so audited
# platform modules can locally allow reviewed FFI boundaries.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[features]
default = []
linux-fido2 = []

[dependencies]
data-encoding = { workspace = true }
hmac = { workspace = true }
locket-core = { version = "0.1.1", path = "../locket-core" }
tempfile = { workspace = true }
keyring-core = { workspace = true }
locket-crypto = { version = "0.1.1", path = "../locket-crypto" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mm", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows = { version = "0.62", features = ["Security_Credentials_UI"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
version = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "alloc",
  "NSError",
  "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "LAContext",
  "LAError",
] }

[dev-dependencies]
tempfile = { workspace = true }
